name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Install dependencies
      run: npm ci
    
    - name: Cache Playwright browsers
      id: cache-playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chrome-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    
    - name: Install Playwright Chromium only
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      run: npx playwright install chromium --with-deps
    
    - name: Install Playwright browser dependencies
      if: steps.cache-playwright.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Run Playwright tests
      run: npx playwright test
      env:
        STANDARD_USER: ${{ secrets.STANDARD_USER }}
        LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
        PROBLEM_USER: ${{ secrets.PROBLEM_USER }}
        PERFORMANCE_GLITCH_USER: ${{ secrets.PERFORMANCE_GLITCH_USER }}
        ERROR_USER: ${{ secrets.ERROR_USER }}
        VISUAL_USER: ${{ secrets.VISUAL_USER }}
        INVALID_USER: ${{ secrets.INVALID_USER }}
        PASSWORD: ${{ secrets.PASSWORD }}
    
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30